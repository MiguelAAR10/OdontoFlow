  /appointments:
    get:
      summary: List Appointments Route
      description: 'Agenda read: the acting organization''s appointments, half-open
        window.


        The window is ``[from_date, to_date)``; both bounds are optional and

        passed as RFC 3339 instants. Location/practitioner filters narrow the

        result; the tenant always comes from the context, never from a query

        parameter (X3).'
      operationId: list_appointments_route_appointments_get
      parameters:
      - name: from_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From Date
      - name: to_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To Date
      - name: location_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Location Id
      - name: practitioner_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Practitioner Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentListItem'
                title: Response List Appointments Route Appointments Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create Appointment Route
      operationId: create_appointment_route_appointments_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /appointments/{appointment_id}:
    get:
      summary: Get Appointment Route
      operationId: get_appointment_route_appointments__appointment_id__get
      parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: integer
          title: Appointment Id
      responses:
        '200':
          description: Successful Response
