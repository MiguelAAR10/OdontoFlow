      summary: Cancel Appointment Route
      operationId: cancel_appointment_route_appointments__appointment_id__cancel_post
      parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: integer
          title: Appointment Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/AppointmentCancel'
              - type: 'null'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentRead'
        '422':
