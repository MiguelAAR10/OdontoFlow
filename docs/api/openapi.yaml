          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /appointments/{appointment_id}/reschedule:
    post:
      summary: Reschedule Appointment Route
      operationId: reschedule_appointment_route_appointments__appointment_id__reschedule_post
      parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: integer
          title: Appointment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentReschedule'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AppointmentCancel:
      properties: {}
      additionalProperties: false
      type: object
      title: AppointmentCancel
      description: 'Empty by design: the appointment is identified by the path, and
        nothing

        about the cancellation is caller-supplied. ``extra=''forbid''`` keeps a

        client from smuggling state through the body.'
    AppointmentCreate:
      properties:
        lead_id:
          type: integer
          title: Lead Id
        service_id:
          type: integer
          title: Service Id
        location_id:
          type: integer
          title: Location Id
        practitioner_id:
          type: integer
          title: Practitioner Id
        start:
          type: string
          format: date-time
          title: Start
      additionalProperties: false
      type: object
      required:
      - lead_id
      - service_id
      - location_id
      - practitioner_id
      - start
      title: AppointmentCreate
    AppointmentListItem:
      properties:
        id:
          type: integer
          title: Id
        lead_id:
          type: integer
          title: Lead Id
        service_id:
          type: integer
          title: Service Id
        practitioner_id:
          type: integer
          title: Practitioner Id
        location_id:
          type: integer
          title: Location Id
        start_utc:
          type: string
          format: date-time
          title: Start Utc
        end_utc:
          type: string
          format: date-time
          title: End Utc
        state:
